[project]
name = "menufinder-backend"
version = "0.1.0"
description = "Backend for MenuFinder - search restaurants by menu items"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "geoalchemy2>=0.15.0",
    # Config & validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # HTTP & scraping
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    # PDF menu extraction
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.0.0",
    "pillow>=10.0.0",
    # AI extraction
    "anthropic>=0.40.0",
    # Auth
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
